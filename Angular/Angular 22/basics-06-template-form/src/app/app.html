<form #userForm="ngForm" (ngSubmit)="onSubmit(userForm.value)">

  <label for="fname">First Name </label>
  <input type="text" name="fname" id="fname" required minlength="5" #fnameRef="ngModel" ngModel/>
  <br>
  @if(fnameRef.invalid && fnameRef.touched){
    @if(fnameRef.errors?.['required']){
    <div class="error">Firstname is required</div>
    }
    @else if(fnameRef.errors?.['minlength']){
    <div class="error">Firstname should be minimum 5 characters</div>
    }

    <div>{{fnameRef.errors|json}}</div>
  }

  <label for="lname">Last Name </label>
  <input type="text" name="lname" id="lname" ngModel/>
  <br/>

  <label for="email">Email     </label>
  <input type="email" name="email" id="email" ngModel>
  <br/>
  <label for="password">Password</label>
  <input type="password" name="password" id="password" ngModel>
  <br/>

  <input type="submit" value="Submit">


</form>
